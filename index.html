<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Texto - Serverless SPA</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --subtitle-color: #666666;
            --textarea-bg: #ffffff;
            --textarea-border: #ccc;
            --card-bg: #f8f9fa;
            --card-text: #333333;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --subtitle-color: #a0a0a0;
            --textarea-bg: #2d2d2d;
            --textarea-border: #444;
            --card-bg: #2d2d2d;
            --card-text: #f1f1f1;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
            transition: background-color 0.3s ease;
        }

        .container { 
            background: var(--container-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 600px; 
            position: relative;
            transition: background-color 0.3s ease;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        h1 { color: #0078D4; font-size: 24px; margin: 0 0 5px 0; }
        p.subtitle { color: var(--subtitle-color); font-size: 14px; margin-bottom: 20px; }

        .btn-theme {
            background: none;
            border: 1px solid var(--textarea-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-theme:hover { background-color: rgba(0, 120, 212, 0.1); }

        textarea { 
            width: 100%; 
            height: 150px; 
            padding: 12px; 
            border: 1px solid var(--textarea-border); 
            background-color: var(--textarea-bg);
            color: var(--text-color);
            border-radius: 8px; 
            font-size: 14px; 
            resize: vertical; 
            box-sizing: border-box; 
            transition: border-color 0.2s, background-color 0.3s; 
        }
        textarea:focus { border-color: #0078D4; outline: none; }

        .btn-group { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        button.action-btn { background-color: #0078D4; color: white; border: none; padding: 10px 15px; font-size: 14px; border-radius: 6px; cursor: pointer; flex: 1; min-width: 120px; transition: background 0.2s; font-weight: 600; }
        button.action-btn:hover { background-color: #106ebe; }
        button.action-btn:disabled { background-color: #a6c8e0; cursor: not-allowed; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
        .btn-danger { background-color: #d9534f; }
        .btn-danger:hover { background-color: #c9302c; }

        .results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 25px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 8px; border-left: 4px solid #0078D4; text-align: center; transition: transform 0.2s, background-color 0.3s; }
        .card:hover { transform: translateY(-2px); }
        .card h3 { margin: 0; font-size: 22px; color: var(--card-text); }
        .card span { font-size: 12px; color: var(--subtitle-color); text-transform: uppercase; letter-spacing: 1px; }
        #loading { display: none; text-align: center; color: #0078D4; font-size: 14px; margin-top: 10px; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-top">
        <div>
            <h1>Analizador de Texto</h1>
            <p class="subtitle">Arquitectura SPA + Azure Functions</p>
        </div>
        <button class="btn-theme" onclick="toggleTheme()">🌓 Tema</button>
    </div>
    
    <textarea id="inputText" placeholder="Escribe o pega tu texto aquí para analizarlo..."></textarea>
    
    <div class="btn-group">
        <button class="action-btn" id="btnAnalizar" onclick="analizarTexto()">Analizar</button>
        <button class="action-btn btn-secondary" onclick="hablarTexto()">🔊 Escuchar</button>
        <button class="action-btn btn-secondary" onclick="pausarReanudarTexto()">⏸️ Pausa/Reanudar</button>
        <button class="action-btn btn-danger" onclick="detenerTexto()">⏹️ Detener</button>
    </div>
    
    <div id="loading">Consultando API Serverless en Azure... ⏳</div>

    <div class="results">
        <div class="card"><h3 id="resPalabras">0</h3><span>Palabras</span></div>
        <div class="card"><h3 id="resCaracteres">0</h3><span>Caracteres</span></div>
        <div class="card"><h3 id="resOraciones">0</h3><span>Oraciones</span></div>
        <div class="card"><h3 id="resTiempo">0 min</h3><span>Lectura Est.</span></div>
    </div>
</div>

<script>
    function toggleTheme() {
        const html = document.documentElement;
        if (html.getAttribute('data-theme') === 'dark') {
            html.removeAttribute('data-theme');
        } else {
            html.setAttribute('data-theme', 'dark');
        }
    }

    async function analizarTexto() {
        const texto = document.getElementById('inputText').value;
        const btn = document.getElementById('btnAnalizar');
        const loading = document.getElementById('loading');
        
        if (!texto.trim()) {
            alert("Por favor ingresa algo de texto.");
            return;
        }

        btn.disabled = true;
        loading.style.display = "block";

        const urlAPI = "/api/analizar";

        try {
            const response = await fetch(urlAPI, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: texto })
            });

            if (!response.ok) throw new Error("Error en la respuesta de la API");

            const data = await response.json();

            document.getElementById('resPalabras').innerText = data.palabras;
            document.getElementById('resCaracteres').innerText = data.caracteres;
            document.getElementById('resOraciones').innerText = data.oraciones;
            document.getElementById('resTiempo').innerText = data.tiempoLectura;

        } catch (error) {
            console.error("Error al conectar con la API Serverless:", error);
            alert("Hubo un error al procesar la petición con la función de Azure.");
        } finally {
            btn.disabled = false;
            loading.style.display = "none";
        }
    }

    function hablarTexto() {
        const texto = document.getElementById('inputText').value;
        if (!texto.trim()) {
            alert("Escribe algo para que pueda leerlo.");
            return;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Limpia cualquier audio previo
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-MX';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Tu navegador no soporta la función de lectura de voz.");
        }
    }

    function pausarReanudarTexto() {
        if ('speechSynthesis' in window) {
            if (window.speechSynthesis.speaking) {
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume(); // Reanuda si estaba pausado
                } else {
                    window.speechSynthesis.pause();  // Pausa si estaba hablando
                }
            }
        }
    }

    function detenerTexto() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Cancela y apaga por completo la voz
        }
    }
</script>

</body>
</html>
