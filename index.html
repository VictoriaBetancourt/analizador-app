<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Texto - Serverless SPA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h1 { color: #0078D4; font-size: 24px; margin-bottom: 10px; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        textarea { width: 100%; height: 150px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; resize: vertical; box-sizing: border-box; }
        button { background-color: #0078D4; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #106ebe; }
        .results { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 25px; }
        .card { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #0078D4; text-align: center; }
        .card h3 { margin: 0; font-size: 22px; color: #333; }
        .card span { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Analizador de Texto Serverless</h1>
    <p class="subtitle">Arquitectura SPA + Azure Functions</p>
    
    <textarea id="inputText" placeholder="Escribe o pega tu texto aquí para analizarlo en tiempo real..."></textarea>
    <button onclick="analizarTexto()">Analizar Texto</button>

    <div class="results">
        <div class="card"><h3 id="resPalabras">0</h3><span>Palabras</span></div>
        <div class="card"><h3 id="resCaracteres">0</h3><span>Caracteres</span></div>
        <div class="card"><h3 id="resOraciones">0</h3><span>Oraciones</span></div>
        <div class="card"><h3 id="resTiempo">0 min</h3><span>Lectura Est.</span></div>
    </div>
</div>

<script>
    async function analizarTexto() {
        const texto = document.getElementById('inputText').value;
        
        if (!texto.trim()) {
            alert("Por favor ingresa algo de texto.");
            return;
        }

        // AQUÍ IRÁ TU URL DE LA AZURE FUNCTION CUANDO LA PUBLIQUES
        const urlAPI = "/api/analizar";

        try {
            const response = await fetch(urlAPI, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: texto })
            });

            const data = await response.json();

            // Actualizamos la SPA de forma asíncrona sin recargar la página
            document.getElementById('resPalabras').innerText = data.palabras;
            document.getElementById('resCaracteres').innerText = data.caracteres;
            document.getElementById('resOraciones').innerText = data.oraciones;
            document.getElementById('resTiempo').innerText = data.tiempoLectura;

        } catch (error) {
            console.error("Error al conectar con la API Serverless:", error);
            alert("Hubo un error al procesar la petición.");
        }
    }
</script>

</body>
</html>
